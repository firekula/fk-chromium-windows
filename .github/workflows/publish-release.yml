name: publish-release
on:
  workflow_run:
    workflows:
      - build-x64
    types:
      - completed

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.context.outputs.artifact_id }}
      ready: ${{ steps.ready.outputs.ready }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      run_attempt: ${{ steps.context.outputs.run_attempt }}
      run_id: ${{ steps.context.outputs.run_id }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Re-fetch and authorize the completed build attempt
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "/repos/$REPOSITORY" > repository.json
          gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID" > run.json
          gh api "/repos/$REPOSITORY/actions/workflows/build-x64.yml" > workflow.json
          gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > artifacts.json
          python tools/release_workflow.py validate-run \
            --run-json run.json \
            --workflow-json workflow.json \
            --artifacts-json artifacts.json \
            --repository-json repository.json \
            --repository "$REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH" \
            --expected-conclusion success \
            --artifact-name fk-chromium-windows-x64 \
            --context-json validated-run.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Download the exact x64 artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.context.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/x64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.context.outputs.run_id }}
      - name: Verify filenames, metadata, hashes, and publication gate
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_metadata.py verify artifacts/x64
          python tools/release_workflow.py classify-publication \
            --artifact-directory artifacts/x64 \
            --context-json validated-run.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Create sanitized publish=true attempt identity
        if: steps.publication.outputs.publish == 'true'
        shell: bash
        env:
          PUBLISHER_RUN_ID: ${{ github.run_id }}
          PUBLISHER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python tools/release_workflow.py create-publication-attempt \
            --artifact-directory artifacts/x64 \
            --context-json validated-run.json \
            --publisher-run-id "$PUBLISHER_RUN_ID" \
            --publisher-run-attempt "$PUBLISHER_RUN_ATTEMPT" \
            --output publication-attempt/publication-attempt.json
      - name: Upload sanitized publication attempt
        if: steps.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fk-chromium-publication-attempt
          path: publication-attempt/publication-attempt.json
          if-no-files-found: error
          retention-days: 4
      - name: Verify publish=true authorization and Task 7 reservation
        if: steps.publication.outputs.publish == 'true'
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python tools/release_metadata.py verify artifacts/x64 --require-publish
          python tools/release_workflow.py bind-release \
            --artifact-directory artifacts/x64 \
            --context-json validated-run.json \
            --notes release-notes.md \
            --github-output "$GITHUB_OUTPUT"
          python tools/release_workflow.py validate-state \
            --repository "$REPOSITORY" \
            --branch "$DEFAULT_BRANCH" \
            --metadata artifacts/x64/fk-build-metadata.json
      - name: Mark authorization complete
        if: steps.publication.outputs.publish == 'true'
        id: ready
        shell: bash
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Complete validated publish=false build without publication
        if: steps.publication.outputs.publish == 'false'
        shell: bash
        run: echo 'publish=false; release publication intentionally skipped'

  publish:
    needs: validate
    if: ${{ needs.validate.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release-${{ needs.validate.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Re-fetch the same authorized run attempt and artifact ID
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.validate.outputs.run_id }}
          RUN_ATTEMPT: ${{ needs.validate.outputs.run_attempt }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "/repos/$REPOSITORY" > repository.json
          gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID" > run.json
          gh api "/repos/$REPOSITORY/actions/workflows/build-x64.yml" > workflow.json
          gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > artifacts.json
          python tools/release_workflow.py validate-run \
            --run-json run.json \
            --workflow-json workflow.json \
            --artifacts-json artifacts.json \
            --repository-json repository.json \
            --repository "$REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH" \
            --expected-conclusion success \
            --artifact-name fk-chromium-windows-x64 \
            --expected-run-attempt "$RUN_ATTEMPT" \
            --expected-artifact-id "$ARTIFACT_ID" \
            --context-json validated-run.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Download the same exact x64 artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/x64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate.outputs.run_id }}
      - name: Re-verify release inputs and Task 7 authorization
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python tools/release_metadata.py verify artifacts/x64 --require-publish
          python tools/release_workflow.py bind-release \
            --artifact-directory artifacts/x64 \
            --context-json validated-run.json \
            --notes release-notes.md
          python tools/release_workflow.py validate-state \
            --repository "$REPOSITORY" \
            --branch "$DEFAULT_BRANCH" \
            --metadata artifacts/x64/fk-build-metadata.json
      - name: Create and publish only the verified release transaction
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          python tools/release_workflow.py publish-release \
            --repository "$REPOSITORY" \
            --expected-release-tag "$EXPECTED_RELEASE_TAG" \
            --artifact-directory artifacts/x64 \
            --context-json validated-run.json \
            --notes release-notes.md
      - name: Record success only after confirmed public release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python tools/release_workflow.py update-state \
            --repository "$REPOSITORY" \
            --branch "$DEFAULT_BRANCH" \
            --metadata artifacts/x64/fk-build-metadata.json
