name: diagnose-reusable-entry
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/diagnose-reusable-entry.yml
      - .github/workflows/diagnose-reusable.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      upstream_ref: ${{ steps.refs.outputs.upstream_ref }}
      branding_ref: ${{ steps.refs.outputs.branding_ref }}
    steps:
      - id: refs
        run: |
          echo 'upstream_ref=abcdef0123456789abcdef0123456789abcdef01' >> "$GITHUB_OUTPUT"
          echo 'branding_ref=0123456789abcdef0123456789abcdef01234567' >> "$GITHUB_OUTPUT"
  call:
    needs: resolve
    uses: ./.github/workflows/diagnose-reusable.yml
    with:
      upstream_tag: 152.0.7977.75-1.1
      upstream_ref: ${{ needs.resolve.outputs.upstream_ref }}
      fk_revision: 1
      force_rebuild: false
      publish: false
      branding_ref: ${{ needs.resolve.outputs.branding_ref }}
