name: diagnose-reusable
on:
  workflow_call:
    inputs:
      python_version:
        type: string
        required: false
        default: '3.12'
      upstream_tag:
        type: string
        required: true
      upstream_ref:
        type: string
        required: true
      fk_revision:
        type: number
        required: false
        default: 1
      force_rebuild:
        type: boolean
        required: false
        default: false
      publish:
        type: boolean
        required: false
        default: false
      branding_ref:
        type: string
        required: true
    outputs:
      finished:
        description: Probe result
        value: ${{ jobs.probe-12.outputs.finished }}

permissions:
  contents: read

concurrency:
  group: diagnose-${{ inputs.upstream_tag }}
  cancel-in-progress: false

jobs:
  probe-1:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Confirm stage 1 scheduling
        id: result
        shell: pwsh
        run: |
          Write-Output 'reusable Windows stage 1 scheduled successfully'
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'finished=true'
    outputs:
      finished: ${{ steps.result.outputs.finished }}
  probe-2:
    needs: probe-1
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
