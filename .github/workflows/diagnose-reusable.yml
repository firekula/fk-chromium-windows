name: diagnose-reusable
on:
  workflow_call:
    inputs:
      python_version:
        type: string
        required: false
        default: '3.12'
      upstream_tag:
        type: string
        required: true
      upstream_ref:
        type: string
        required: true
      fk_revision:
        type: number
        required: false
        default: 1
      force_rebuild:
        type: boolean
        required: false
        default: false
      publish:
        type: boolean
        required: false
        default: false
      branding_ref:
        type: string
        required: true
    outputs:
      finished:
        description: Probe result
        value: ${{ jobs.build-1.outputs.finished }}

permissions:
  contents: read

concurrency:
  group: diagnose-${{ inputs.upstream_tag }}
  cancel-in-progress: false

jobs:
  build-1:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Prepare FK build
        id: prepare
        uses: ./.github/actions/prepare-fk
        with:
          python_version: ${{ inputs.python_version }}
          upstream_tag: ${{ inputs.upstream_tag }}
          upstream_ref: ${{ inputs.upstream_ref }}
          fk_revision: ${{ inputs.fk_revision }}
          force_rebuild: ${{ inputs.force_rebuild }}
          publish: ${{ inputs.publish }}
          branding_ref: ${{ inputs.branding_ref }}
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: false
          from_artifact: false
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
