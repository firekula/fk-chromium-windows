name: reusable-build
on:
  workflow_call:
    inputs:
      python_version:
        type: string
        required: false
        default: '3.12'
      upstream_tag:
        type: string
        required: true
      upstream_ref:
        type: string
        required: true
      fk_revision:
        type: number
        required: false
        default: 1
      force_rebuild:
        type: boolean
        required: false
        default: false
      publish:
        type: boolean
        required: false
        default: false
      branding_ref:
        type: string
        required: true
    outputs:
      finished:
        description: Whether the staged build completed
        value: ${{ jobs.build-12.outputs.finished }}
      upstream_version:
        description: Four-part Chromium version
        value: ${{ jobs.build-12.outputs.upstream_version }}
      release_tag:
        description: FK Chromium release tag
        value: ${{ jobs.build-12.outputs.release_tag }}
      publish:
        description: Whether the completed build may be published
        value: ${{ jobs.build-12.outputs.publish }}

permissions:
  contents: read

jobs:
  build-1:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Prepare FK build
        id: prepare
        uses: ./.github/actions/prepare-fk
        with:
          python_version: ${{ inputs.python_version }}
          upstream_tag: ${{ inputs.upstream_tag }}
          upstream_ref: ${{ inputs.upstream_ref }}
          fk_revision: ${{ inputs.fk_revision }}
          force_rebuild: ${{ inputs.force_rebuild }}
          publish: ${{ inputs.publish }}
          branding_ref: ${{ inputs.branding_ref }}
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: false
          from_artifact: false
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
  build-2:
    needs: build-1
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Prepare FK build
        id: prepare
        uses: ./.github/actions/prepare-fk
        with:
          python_version: ${{ inputs.python_version }}
          upstream_tag: ${{ inputs.upstream_tag }}
          upstream_ref: ${{ inputs.upstream_ref }}
          fk_revision: ${{ inputs.fk_revision }}
          force_rebuild: ${{ inputs.force_rebuild }}
          publish: ${{ inputs.publish }}
          branding_ref: ${{ inputs.branding_ref }}
      - name: Run stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
  build-3:
    needs: build-2
    runs-on: windows-2022
